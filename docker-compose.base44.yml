services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: mongosh --eval "db.runCommand({ping:1})" --quiet
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-slim
    working_dir: /app/mern/server
    volumes:
      - .:/app
      - server_modules:/app/mern/server/node_modules
    environment:
      - ATLAS_URI=mongodb://mongodb:27017/
      - PORT=5050
    command: sh -c "npm install && node server.js"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: node -e "fetch('http://localhost:5050/record').then(r=>{if(!r.ok)throw 1;process.exit(0)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 10

  client:
    image: node:22-slim
    working_dir: /app/mern/client
    volumes:
      - .:/app
      - client_modules:/app/mern/client/node_modules
    environment:
      - VITE_API_PROXY=http://api:5050
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongodb-data:
  server_modules:
  client_modules:
