services:
  mongodb:
    image: mongo:7
    restart: on-failure
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  server-deps:
    image: node:22
    working_dir: /app
    volumes:
      - ./mern/server:/app
      - server-node-modules:/app/node_modules
    command: ["sh", "-ec", "npm ci --no-audit --no-fund"]

  seed:
    image: node:22
    working_dir: /app
    volumes:
      - ./mern/server:/app
      - server-node-modules:/app/node_modules
    environment:
      - ATLAS_URI=mongodb://mongodb:27017/
    # Seed only when the collection is empty (seed.js wipes existing records).
    command:
      - sh
      - -ec
      - |
        COUNT=$$(node --input-type=module -e "import {MongoClient} from 'mongodb'; const c=new MongoClient(process.env.ATLAS_URI); await c.connect(); console.log(await c.db('employees').collection('records').countDocuments()); await c.close();")
        if [ "$$COUNT" = "0" ]; then node seed.js; else echo "Skipping seed: $$COUNT records exist"; fi
    depends_on:
      mongodb:
        condition: service_healthy
      server-deps:
        condition: service_completed_successfully

  server:
    image: node:22
    restart: on-failure
    working_dir: /app
    volumes:
      - ./mern/server:/app
      - server-node-modules:/app/node_modules
    environment:
      - ATLAS_URI=mongodb://mongodb:27017/
      - PORT=5050
    command: ["node", "--watch", "server.js"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5050/record"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      mongodb:
        condition: service_healthy
      server-deps:
        condition: service_completed_successfully

  client:
    image: node:22
    restart: on-failure
    working_dir: /app
    ports:
      - "3000:5173"
    volumes:
      - ./mern/client:/app
      - client-node-modules:/app/node_modules
    environment:
      - API_PROXY_TARGET=http://server:5050
      - CYPRESS_INSTALL_BINARY=0
      - CHOKIDAR_USEPOLLING=true
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:5173/ || { echo 'vite down'; exit 1; }; curl -fsS -o /dev/null http://localhost:5173/record || { echo 'api proxy down'; exit 1; }"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongodb-data:
  server-node-modules:
  client-node-modules:
